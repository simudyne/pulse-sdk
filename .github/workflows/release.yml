name: Release

run-name: 📦 Create Release from ${{ github.ref_name }}

on:
  push:
    branches: [prod, dev]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  id-token: write   # required for PyPI Trusted Publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "pip==26.2.2" "certifi>=2026.10.19" python-semantic-release

      - name: Run semantic-release
        id: release
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Only publishes when semantic-release actually cut a new version.
      # prod -> stable (0.6.0); dev -> prerelease (0.6.0.dev1, skipped by
      # `pip install` unless `--pre` is passed). No API token: PyPI trusts
      # this repo+workflow via OIDC (see Trusted Publisher setup in README).
      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
