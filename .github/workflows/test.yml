name: Test

run-name: 🧪 Run tests (${{ github.ref_name }})

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "pip==26.2.2" "certifi>=2026.10.19" -e ".[test]"

      - name: Run tests
        run: pytest tests/
